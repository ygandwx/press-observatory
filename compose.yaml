x-app: &app
  image: press-observatory:${APP_TAG:-local}
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  restart: unless-stopped
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observatory}
      POSTGRES_USER: ${POSTGRES_USER:-observatory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      retries: 20
  init:
    <<: *app
    restart: "no"
    command: ["sh","-ec","python manage.py migrate --noinput && python manage.py bootstrap"]
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: ["python","manage.py","worker"]
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  pgdata:
