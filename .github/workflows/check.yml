name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: isolated-ci-database
          POSTGRES_DB: observatory
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 4s --health-retries 15
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: isolated-ci-database
      POSTGRES_HOST: 127.0.0.1
      DJANGO_SECRET_KEY: isolated-ci-django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/check_docs.py
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python manage.py test desk
        working-directory: backend
      - run: docker build -t press-observatory:ci .
